name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        channel: [omarchy-stable, arch]
    uses: ./.github/workflows/build.yml
    with:
      channel: ${{ matrix.channel }}

  required:
    # Preserve the check name required by main's branch protection.
    name: Build and test on Arch Linux
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and installation check
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
