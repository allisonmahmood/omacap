name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.channel }}
    strategy:
      fail-fast: false
      matrix:
        channel: [omarchy-stable, arch]
    uses: ./.github/workflows/build.yml
    with:
      channel: ${{ matrix.channel }}
